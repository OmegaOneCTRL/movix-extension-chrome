<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ffffff18;
    }
    .logo { width: 38px; height: 38px; border-radius: 9px; overflow: hidden; flex-shrink: 0; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .header-text h1 { font-size: 17px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 11px; color: #aaa; margin-top: 2px; }


    /* ── States ──────────────────────────────── */
    .state { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .state.active { display: flex; }

    .spinner {
      width: 34px; height: 34px;
      border: 3px solid #ffffff22;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: #4caf50;
      background: #4caf5018; border: 1px solid #4caf5030;
      border-radius: 20px; padding: 3px 10px;
    }
    .status-badge::before {
      content: ''; width: 6px; height: 6px;
      background: #4caf50; border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Buttons ─────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 12px 18px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px #e9456033;
      transition: opacity .15s, transform .1s;
    }
    .btn-primary:hover  { opacity: .92; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); opacity: .85; }

    .btn-outline {
      padding: 8px 16px;
      background: transparent; border: 1px solid #e94560;
      border-radius: 8px; color: #e94560; font-size: 13px;
      cursor: pointer; transition: background .15s;
    }
    .btn-outline:hover { background: #e9456018; }

    .btn-ghost {
      padding: 7px 12px;
      background: #ffffff0a; border: 1px solid #ffffff12;
      border-radius: 7px; color: #aaa; font-size: 12px;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .btn-ghost:hover { background: #ffffff18; color: #fff; }

    /* ── URL Chip ────────────────────────────── */
    .url-chip {
      background: #ffffff0d; border: 1px solid #ffffff14;
      border-radius: 8px; padding: 7px 12px;
      font-size: 12px; color: #80d8ff; width: 100%;
      text-align: center; word-break: break-all;
      cursor: pointer; transition: background .15s;
    }
    .url-chip:hover { background: #ffffff1a; }

    /* ── Footer ──────────────────────────────── */
    .footer {
      padding: 8px 14px; border-top: 1px solid #ffffff10;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-link { font-size: 11px; color: #555; text-decoration: none; transition: color .15s; }
    .footer-link:hover { color: #e94560; }
    .alt-links { display: flex; gap: 6px; }
    .alt-chip {
      font-size: 10px; color: #666;
      background: #ffffff08; border: 1px solid #ffffff10;
      border-radius: 4px; padding: 2px 6px;
      cursor: pointer; transition: all .15s; text-decoration: none;
    }
    .alt-chip:hover { color: #80d8ff; border-color: #80d8ff44; background: #80d8ff10; }

    .error-text { font-size: 12px; color: #ff6b6b; text-align: center; white-space: pre-line; }
    .panel { padding: 14px; }
    .cache-note { color: #aaa; font-size: 11px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo"><img src="icons/icon48.png" alt="Movix" /></div>
  <div class="header-text">
    <h1>Movix</h1>
    <p>Lien officiel</p>
  </div>
</div>


<!-- ══ Panel : Movix ══════════════════════════ -->
<div id="panel-movix" class="panel active">

  <div id="state-loading" class="state active">
    <div class="spinner"></div>
    <p style="font-size:13px;color:#aaa">Récupération du lien officiel…</p>
  </div>

  <div id="state-success" class="state" style="gap:10px">
    <div class="status-badge" id="status-badge">Lien primaire</div>
    <button class="btn-primary" id="open-btn">🎬 Ouvrir Movix</button>
    <div class="url-chip" id="url-chip"></div>
    <p class="cache-note" id="cache-note" role="status"></p>
  </div>

  <div id="state-error" class="state">
    <span style="font-size:26px">⚠️</span>
    <p class="error-text" id="error-msg">Impossible de récupérer le lien.</p>
    <button class="btn-outline" id="retry-btn">Réessayer</button>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <a class="footer-link" href="https://t.me/movix_site" target="_blank" id="tg-link">Telegram</a>
  <div class="alt-links" id="alt-links"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
